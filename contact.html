<h2>Contact me</h2>
<p style="margin-bottom:1rem">Email: <a href="mailto:l.ameh6735@miva.edu.ng">l.ameh6735@miva.edu.ng</a> | Phone: <a href="tel:08022975576">08022975576</a></p>
<form id="contact-form" novalidate>
<div><label for="name">Name</label><input id="name" name="name" type="text"><p class="error" id="name-error"></p></div>
<div><label for="email">Email address</label><input id="email" name="email" type="text" inputmode="email"><p class="error" id="email-error"></p></div>
<div><label for="phone">Phone number</label><input id="phone" name="phone" type="text" inputmode="numeric"><p class="error" id="phone-error"></p></div>
<div><label for="message">Message</label><textarea id="message" name="message" rows="5"></textarea><p class="error" id="message-error"></p></div>
<button class="btn" type="submit">Send message</button>
<p class="success" id="success" role="status">Thank you. Your message has been sent.</p>
</form>
